name: PR Validator

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
            
      - name: Check PR description
        run: |
          if [ -z "${{ github.event.pull_request.body }}" ]; then
            echo "PR description is required"
            exit 1
          fi
          
      - name: Check for changes
        run: |
          if [ $(git diff --name-only HEAD^ HEAD | wc -l) -eq 0 ]; then
            echo "No changes detected in PR"
            exit 1
          fi
          
      - name: Validate file changes
        run: |
          # Check for sensitive files
          if git diff --name-only HEAD^ HEAD | grep -E "(\\.env|config/secrets|credentials)"; then
            echo "Sensitive files detected in PR"
            exit 1
          fi