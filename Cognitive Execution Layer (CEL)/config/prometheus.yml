# Prometheus Metrics Configuration

# Global configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "cel_alerts.yml"
  - "cel_rules.yml"

# Scrape configurations
scrape_configs:
  # CEL Core Service
  - job_name: 'cel-core'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # CEL AI Router Service
  - job_name: 'cel-ai-router'
    static_configs:
      - targets: ['localhost:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # Node.js Application Metrics
  - job_name: 'nodejs-app'
    static_configs:
      - targets: ['localhost:9100']
    metrics_path: '/metrics'
    scrape_interval: 15s
    
  # System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
    
  # Process Metrics
  - job_name: 'process-exporter'
    static_configs:
      - targets: ['localhost:9256']
    scrape_interval: 15s

# Remote write configuration (optional)
remote_write:
  - url: "http://prometheus-remote-write:9090/api/v1/write"
    write_relabel_configs:
      - source_labels: [__name__]
        regex: '(cel_|nodejs_|process_)'
        action: keep